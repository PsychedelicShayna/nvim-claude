name: Label new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  needs-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark the new issue for triage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api --method POST "repos/$GH_REPO/issues/$ISSUE_NUMBER/labels" \
            -f 'labels[]=needs-triage'
